<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style><?!= include_('frontend/shared/theme') ?></style>
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: 100%; max-width: 380px; padding: 32px; }
    .login-title { font-size: 22px; margin-bottom: 4px; }
    .login-sub { margin-bottom: 24px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--nc-ink-soft); }
    .login-error { color: var(--nc-red); font-size: 13px; margin-top: 10px; min-height: 18px; }
    .demo-accounts { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--nc-line); font-size: 12px; color: var(--nc-ink-soft); }
    .demo-accounts code { background: #EEF1F0; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="nc-card login-card">
      <div class="nc-display login-title">NC 2027 Reporting &amp; Monitoring System</div>
      <div class="nc-muted login-sub">Pitching / demo prototype — synthetic data only.</div>

      <form id="loginForm">
        <div class="login-field">
          <label for="username">Username</label>
          <input class="nc-input" id="username" autocomplete="username" required />
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input class="nc-input" id="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="nc-btn-primary" type="submit" style="width:100%" id="loginBtn">Login</button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="demo-accounts">
        Demo accounts (password = username): <code>nc.demo</code>, <code>dataentry.demo</code>, <code>analyst.demo</code>, <code>client.demo</code>.
        First time here? Run <code>seedDemo()</code> from the Apps Script editor first.
      </div>
    </div>
  </div>

  <script><?!= include_('frontend/shared/api') ?></script>
  <script>
    var ROUTE_BY_ROLE = { NC: '?page=nc', DATA_ENTRY: '?page=data-entry', DATA_ANALYST: '?page=analyst', CLIENT: '?page=client' };

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      var errorEl = document.getElementById('loginError');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      callApi('login', { username: document.getElementById('username').value.trim(), password: document.getElementById('password').value })
        .then(function (res) {
          if (!res.success) { errorEl.textContent = res.message; btn.disabled = false; btn.textContent = 'Login'; return; }
          ncSetSession(res.data);
          window.location.href = ROUTE_BY_ROLE[res.data.role_code] || '?page=login';
        })
        .catch(function (err) {
          errorEl.textContent = err.message || 'Login failed.';
          btn.disabled = false;
          btn.textContent = 'Login';
        });
    });
  </script>
</body>
</html>
