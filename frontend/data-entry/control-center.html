<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style><?!= include_('frontend/shared/theme') ?></style>
  <style>
    .layout { max-width: 1100px; margin: 0 auto; padding: var(--nc-space-3); }
    .summary-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: var(--nc-space-3); }
    .summary-card { text-align: center; }
    .summary-card .value { font-family: var(--nc-font-display); font-size: 28px; color: var(--nc-navy-deep); }
    .summary-card .label { font-size: 12px; color: var(--nc-ink-soft); margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: var(--nc-surface); border-radius: var(--nc-radius-md); overflow: hidden; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--nc-line); font-size: 14px; }
    th { color: var(--nc-ink-soft); font-weight: 500; font-size: 12px; background: #F7F8F7; }
    tr:last-child td { border-bottom: none; }
    tr.clickable:hover { background: #F5F7F6; cursor: pointer; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(14,33,56,.45); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: #fff; border-radius: var(--nc-radius-md); max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; padding: var(--nc-space-3); }
    .modal h3 { margin-bottom: 12px; }
    .modal-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--nc-line); font-size: 14px; }
    .modal-actions { display: flex; gap: 10px; margin-top: var(--nc-space-2); }
  </style>
</head>
<body>
  <div class="nc-app-header">
    <div class="nc-display">Data Entry Control Center</div>
    <button class="nc-btn-secondary" style="background:transparent;border-color:rgba(255,255,255,.4);color:#fff" onclick="ncLogout()">Logout</button>
  </div>

  <div class="layout">
    <div class="summary-row" id="summaryRow"></div>
    <div class="nc-section-title" style="font-weight:600;color:var(--nc-navy-deep);margin-bottom:12px;font-family:var(--nc-font-display)">Exception queue (warning / error only)</div>
    <table>
      <thead><tr><th>Store</th><th>NC</th><th>Task</th><th>Status</th><th>Submitted</th></tr></thead>
      <tbody id="exceptionRows"></tbody>
    </table>
    <div class="nc-empty-state" id="emptyState" hidden>No exceptions right now — every submission passed validation.</div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" id="modalContent"></div>
  </div>

  <script><?!= include_('frontend/shared/api') ?></script>
  <script>
    var session = ncRequireSession('DATA_ENTRY');
    if (session) loadControlCenter();

    function loadControlCenter() {
      callApi('getControlCenter').then(function (res) {
        if (!res.success) return;
        renderSummary(res.data.summary);
        renderExceptions(res.data.exceptions);
      });
    }

    function renderSummary(s) {
      var cards = [
        { label: 'Total', value: s.total }, { label: 'Pass', value: s.pass },
        { label: 'Warning', value: s.warning }, { label: 'Error', value: s.error },
        { label: 'Correction', value: s.correction }
      ];
      document.getElementById('summaryRow').innerHTML = cards.map(function (c) {
        return '<div class="nc-card summary-card"><div class="value">' + c.value + '</div><div class="label">' + c.label + '</div></div>';
      }).join('');
    }

    function renderExceptions(list) {
      var tbody = document.getElementById('exceptionRows');
      tbody.innerHTML = '';
      document.getElementById('emptyState').hidden = list.length > 0;
      list.forEach(function (row) {
        var tr = document.createElement('tr');
        tr.className = 'clickable';
        tr.innerHTML = '<td>' + row.store_name + '</td><td>' + row.nc_name + '</td><td>' + row.task_code.replace('_', ' ') + '</td>' +
          '<td><span class="nc-badge nc-badge-' + (row.validation_status === 'ERROR' ? 'error' : 'warning') + '">' + row.validation_status + '</span></td>' +
          '<td class="nc-muted">' + row.server_timestamp + '</td>';
        tr.onclick = function () { openDetail(row.submission_id); };
        tbody.appendChild(tr);
      });
    }

    function openDetail(submissionId) {
      callApi('getSubmission', { submission_id: submissionId }).then(function (res) {
        if (!res.success) return;
        var d = res.data;
        var rulesHtml = d.validation_results.map(function (v) {
          return '<div class="modal-row"><span>' + v.rule_code + '</span><span class="nc-badge nc-badge-' + (v.result === 'ERROR' ? 'error' : (v.result === 'WARNING' ? 'warning' : 'pass')) + '">' + v.result + '</span></div>';
        }).join('');
        document.getElementById('modalContent').innerHTML =
          '<h3>' + d.store.store_name + ' — ' + d.submission.task_code.replace('_', ' ') + '</h3>' +
          '<div class="modal-row"><span>NC</span><span>' + d.user.full_name + '</span></div>' +
          '<div class="modal-row"><span>Submitted</span><span>' + d.submission.server_timestamp + '</span></div>' +
          '<div class="modal-row"><span>Status</span><span>' + d.submission.submission_status + '</span></div>' +
          '<div style="margin-top:14px;font-weight:600">Validation results</div>' + rulesHtml +
          '<div class="modal-actions">' +
          '<button class="nc-btn-primary" onclick="approve(\'' + submissionId + '\')">Approve</button>' +
          '<button class="nc-btn-secondary" onclick="correction(\'' + submissionId + '\')">Request Correction</button>' +
          '<button class="nc-btn-secondary" onclick="closeModal()">Close</button></div>';
        document.getElementById('modal').hidden = false;
      });
    }

    function closeModal() { document.getElementById('modal').hidden = true; loadControlCenter(); }

    function approve(submissionId) {
      callApi('approveSubmission', { submission_id: submissionId, actor_id: session.user_id }).then(function () { closeModal(); });
    }

    function correction(submissionId) {
      var reason = prompt('Reason for correction request:');
      if (reason === null) return;
      callApi('requestCorrection', { submission_id: submissionId, actor_id: session.user_id, reason_code: 'MANUAL_REVIEW', reason_text: reason }).then(function () { closeModal(); });
    }
  </script>
</body>
</html>
